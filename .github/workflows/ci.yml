name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workmind
          POSTGRES_PASSWORD: "Wm2026Bender!Pg"
          POSTGRES_DB: workmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: workmind-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://workmind:Wm2026Bender!Pg@localhost:5432/workmind_test
          REDIS_URL: redis://localhost:6379/0
          WORKMIND_SECRET_KEY: test-secret-key-not-for-production
          WORKMIND_ENV: development
        run: python -m pytest tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workmind-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check app/ clients/ --select E,W,F --ignore E501
