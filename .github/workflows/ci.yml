# =============================================================================
# WorkMind — GitHub Actions CI
# CONFIDENTIAL - PRIVATE REPOSITORY - NOT FOR PUBLIC DISTRIBUTION
#
# Runs on every push and pull request to main.
# Validates syntax, runs tests, checks code quality.
# =============================================================================

name: WorkMind CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout (private)
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Syntax check — all Python files
        run: |
          find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" \
            | xargs python -m py_compile
          echo "Syntax OK"

      - name: Run test suite
        env:
          WORKMIND_NODE_ID: ci-node
          WORKMIND_ENV: staging
          LOG_LEVEL: WARNING
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=. \
            --cov-omit="tests/*,.venv/*,venv/*" \
            --cov-report=term-missing

      - name: Verify version.py integrity
        run: python -c "from version import VERSION, get_full_version; print(get_full_version())"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    needs: validate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r . \
            --exclude .venv,venv,tests \
            --severity-level medium \
            --confidence-level medium \
            -f txt || true   # warn but don't block CI for now
