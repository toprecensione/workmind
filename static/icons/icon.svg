<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a4fa8"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect (iOS-style) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Shine overlay top half -->
  <rect width="512" height="280" rx="115" fill="url(#shine)"/>
  <!-- W monogram, centered, bold white -->
  <polyline
    points="72,128 164,390 256,226 348,390 440,128"
    fill="none"
    stroke="white"
    stroke-width="54"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Circuit row (WorkMind tagline / mind connections) -->
  <line x1="142" y1="440" x2="370" y2="440"
        stroke="rgba(255,255,255,0.28)" stroke-width="3"/>
  <circle cx="152" cy="440" r="9" fill="rgba(255,255,255,0.45)"/>
  <circle cx="208" cy="440" r="9" fill="rgba(255,255,255,0.45)"/>
  <circle cx="256" cy="440" r="9" fill="rgba(255,255,255,0.45)"/>
  <circle cx="304" cy="440" r="9" fill="rgba(255,255,255,0.45)"/>
  <circle cx="360" cy="440" r="9" fill="rgba(255,255,255,0.45)"/>
</svg>
