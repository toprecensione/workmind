[build-system]
requires = ["setuptools>=68.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workmind-api"
version = "2.0.0"
description = "WorkMind Platform — FastAPI Core API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httptools>=0.6.1",
    "uvloop>=0.19.0",
    # Database
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",      # sync driver for Alembic
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    # Redis / Celery
    "redis[asyncio]>=5.0.4",
    "celery[redis]>=5.4.0",
    # Settings / validation
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    # HTTP client (for AI provider calls)
    "httpx>=0.27.0",
    # Structured logging
    "structlog>=24.1.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Utilities
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
    # Knowledge Base / document parsing
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "ezdxf>=1.2.0",
    "watchdog>=4.0.0",
    "anthropic>=0.25.0",
    "psutil>=5.9.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Observability
    "prometheus-client>=0.20",
    # Task scheduling
    "apscheduler>=3.10.0",
    # 2FA
    "pyotp>=2.9.0",
    # QR code generation
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
