# WorkMind v2 MEDIC — Nginx Site Configuration
# Tailscale HTTPS only. No public ports.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# HTTP → HTTPS redirect
server {
    listen 100.116.199.50:80;
    server_name workmind-bender.tail898ef4.ts.net;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 100.116.199.50:443 ssl http2;
    server_name workmind-bender.tail898ef4.ts.net;

    ssl_certificate     /etc/ssl/workmind/ts.crt;
    ssl_certificate_key /etc/ssl/workmind/ts.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── FastAPI ────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # ── SvelteKit immutable assets (1 year cache) ──────────────────────────────
    location /_app/immutable/ {
        root /var/www/medic;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SvelteKit SPA — serve static, fallback to index.html ──────────────────
    location / {
        root /var/www/medic;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
