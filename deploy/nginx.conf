# WorkMind 3 — Nginx reverse proxy config
# Install: sudo ln -s /home/emanuele/workmind-v2/deploy/nginx.conf /etc/nginx/sites-enabled/workmind
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx

upstream workmind_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS (Tailscale provides the cert)
server {
    listen 80;
    server_name workmind-bender.tail898ef4.ts.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name workmind-bender.tail898ef4.ts.net;

    # Tailscale TLS certs (auto-provisioned via `tailscale cert`)
    ssl_certificate     /var/lib/tailscale/certs/workmind-bender.tail898ef4.ts.net.crt;
    ssl_certificate_key /var/lib/tailscale/certs/workmind-bender.tail898ef4.ts.net.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/workmind_access.log combined;
    error_log  /var/log/nginx/workmind_error.log warn;

    # Request size limit (file uploads)
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # Proxy to uvicorn
    location / {
        proxy_pass http://workmind_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # WebSocket support (for future use)
    location /ws/ {
        proxy_pass http://workmind_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Static files (SvelteKit build) — serve directly from Nginx for performance
    location /_app/ {
        root /home/emanuele/workmind-v2/workmind-frontend/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /favicon.png {
        root /home/emanuele/workmind-v2/workmind-frontend/build;
        expires 30d;
        access_log off;
    }
}
