# WorkMind STAGING — append to /etc/nginx/sites-available/workmind
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 100.116.199.50:8443 ssl;
    server_name workmind-bender.tail898ef4.ts.net;

    ssl_certificate     /etc/ssl/workmind/ts.crt;
    ssl_certificate_key /etc/ssl/workmind/ts.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Visible banner so devs know they are on staging
    add_header X-WorkMind-Environment "staging";

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
